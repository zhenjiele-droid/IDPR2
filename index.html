<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小傑空間攝影 CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:white;padding:18px}h1{font-size:21px;margin:0}.sub{color:#cbd5e1;font-size:12px;margin-top:4px}nav{display:flex;gap:7px;margin-top:14px}nav button{border:0;border-radius:9px;padding:9px 13px;background:#374151;color:white}nav button.active{background:white;color:#111827}main{max-width:900px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}.label{font-size:12px;color:#6b7280}.metric{font-size:20px;font-weight:700;margin-top:4px}h2{font-size:17px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.primary,.secondary,.danger{border-radius:9px;padding:9px 12px}.primary{background:#111827;color:white;border:0}.secondary{background:white;border:1px solid #d1d5db}.danger{background:white;color:#b91c1c;border:1px solid #fecaca}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.meta{font-size:12px;color:#6b7280;line-height:1.7}.pill{background:#eef2ff;border-radius:99px;padding:3px 7px;font-size:11px}.actions{display:flex;gap:6px;margin-top:9px}dialog{border:0;border-radius:16px;width:min(700px,94vw);padding:0}dialog::backdrop{background:#0008}.modal{padding:18px}.modal-actions{text-align:right;margin-top:15px}.hidden{display:none}.empty{text-align:center;color:#6b7280;padding:25px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>小傑空間攝影 CRM</h1><div class="sub">案件、客戶、報價與收款管理</div><nav><button class="active" onclick="tab('home',this)">總覽</button><button onclick="tab('cases',this)">案件</button><button onclick="tab('companies',this)">公司</button></nav></header>
<main><section id="home"></section><section id="cases" class="hidden"></section><section id="companies" class="hidden"></section></main>
<dialog id="caseDlg"><div class="modal"><h2>案件</h2><form id="caseForm"><div class="formgrid">
<div><label>設計公司</label><select id="company"></select></div><div><label>案件名稱</label><input id="name" required></div>
<div><label>拍攝日期</label><input id="date" type="date"></div><div><label>案件種類</label><select id="type"><option>住宅</option><option>商空</option><option>辦公室</option><option>樣品屋</option><option>其他</option></select></div>
<div><label>坪數</label><input id="size" type="number"></div><div><label>設計師</label><input id="designer"></div>
<div class="full"><label>案場地址</label><input id="address"></div>
<div><label>狀態</label><select id="status"><option>洽談中</option><option>已報價</option><option>已確認</option><option>已拍攝</option><option>待交件</option><option>待收款</option><option>已結案</option></select></div>
<div><label>付款</label><select id="paid"><option>未收款</option><option>已收款</option></select></div>
<div><label>付款日期</label><input id="paidDate" type="date"></div><div><label>需要發票</label><select id="invoice"><option>否</option><option>是</option></select></div>
<div><label>車馬費</label><input id="travel" type="number" value="0"></div><div><label>助理班費</label><input id="assistant" type="number" value="0"></div>
<div><label>攝影服務費</label><input id="service" type="number" value="0"></div><div><label>案場資料/備註</label><input id="notes"></div>
</div><div class="modal-actions"><button type="button" class="secondary" onclick="caseDlg.close()">取消</button> <button class="primary">儲存</button></div></form></div></dialog>
<dialog id="companyDlg"><div class="modal"><h2>設計公司</h2><form id="companyForm"><div class="formgrid">
<div><label>公司名稱</label><input id="coName" required></div><div><label>聯絡人</label><input id="coContact"></div>
<div><label>電話</label><input id="coPhone"></div><div><label>LINE / IG</label><input id="coSocial"></div>
<div><label>Email</label><input id="coEmail"></div><div><label>合作狀態</label><select id="coStatus"><option>合作中</option><option>潛在客戶</option><option>暫停合作</option></select></div>
</div><div class="modal-actions"><button type="button" class="secondary" onclick="companyDlg.close()">取消</button> <button class="primary">儲存</button></div></form></div></dialog>
<script>
const K='xiaojieCRM',D=()=>JSON.parse(localStorage.getItem(K)||'{"companies":[],"cases":[]}');let db=D(),edit=null,editCo=null;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0);
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function cname(id){let c=db.companies.find(x=>x.id==id);return c?c.name:'未指定'}
function tab(id,b){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function render(){let total=db.cases.reduce((a,x)=>a+x.total,0),paid=db.cases.filter(x=>x.paid==='已收款').reduce((a,x)=>a+x.total,0);
$('home').innerHTML='<div class="grid"><div class="card"><div class="label">案件</div><div class="metric">'+db.cases.length+'</div></div><div class="card"><div class="label">公司</div><div class="metric">'+db.companies.length+'</div></div><div class="card"><div class="label">已收款</div><div class="metric">'+money(paid)+'</div></div><div class="card"><div class="label">待收款</div><div class="metric">'+money(total-paid)+'</div></div></div><div class="card"><div class="row"><h2>最近案件</h2><button class="primary" onclick="openCase()">＋新增</button></div>'+db.cases.slice(0,5).map(ch).join('')||'<div class="empty">尚無案件</div>'+'</div>';
$('cases').innerHTML='<div class="row"><h2>案件管理</h2><button class="primary" onclick="openCase()">＋新增案件</button></div><input id="search" placeholder="搜尋案件/公司/設計師/地址" oninput="filter()"><div id="list">'+db.cases.map(ch).join('')+'</div>';
$('companies').innerHTML='<div class="row"><h2>設計公司</h2><button class="primary" onclick="openCompany()">＋新增公司</button></div>'+db.companies.map(c=>'<div class="card"><div class="row"><div><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.contact)+' '+esc(c.phone)+'</div></div><span class="pill">'+esc(c.status)+'</span></div><div class="actions"><button class="secondary" onclick="openCompany(\''+c.id+'\')">編輯</button><button class="danger" onclick="delCompany(\''+c.id+'\')">刪除</button></div></div>').join('')||'<div class="empty">尚無公司</div>'}
function ch(x){return '<div class="card"><div class="row"><div><b>'+esc(x.name)+'</b><div class="meta">'+esc(cname(x.companyId))+' · '+esc(x.date)+' · '+esc(x.type)+'<br>'+esc(x.address)+'</div></div><b>'+money(x.total)+'</b></div><div class="meta"><span class="pill">'+esc(x.status)+'</span> <span class="pill">'+esc(x.paid)+'</span></div><div class="actions"><button class="secondary" onclick="openCase(\''+x.id+'\')">編輯</button><button class="danger" onclick="delCase(\''+x.id+'\')">刪除</button></div></div>'}
function filter(){let q=($('search').value||'').toLowerCase();$('list').innerHTML=db.cases.filter(x=>(x.name+' '+cname(x.companyId)+' '+x.designer+' '+x.address).toLowerCase().includes(q)).map(ch).join('')||'<div class="empty">找不到</div>'}
function openCase(id){edit=id||null;let x=id?db.cases.find(a=>a.id===id):{};$('company').innerHTML='<option value="">未指定</option>'+db.companies.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');$('company').value=x.companyId||'';['name','date','size','designer','address','paidDate','travel','assistant','service','notes'].forEach(k=>$(k).value=x[k]??(k==='travel'||k==='assistant'||k==='service'?0:''));$('type').value=x.type||'住宅';$('status').value=x.status||'洽談中';$('paid').value=x.paid||'未收款';$('invoice').value=x.invoice||'否';caseDlg.showModal()}
$('caseForm').onsubmit=e=>{e.preventDefault();let x={id:edit||crypto.randomUUID(),companyId:$('company').value,name:$('name').value,date:$('date').value,type:$('type').value,size:$('size').value,designer:$('designer').value,address:$('address').value,status:$('status').value,paid:$('paid').value,paidDate:$('paidDate').value,invoice:$('invoice').value,travel:+$('travel').value||0,assistant:+$('assistant').value||0,service:+$('service').value||0,notes:$('notes').value};x.total=x.travel+x.assistant+x.service;let i=db.cases.findIndex(a=>a.id===x.id);i<0?db.cases.unshift(x):db.cases[i]=x;caseDlg.close();save()}
function delCase(id){if(confirm('確定刪除？')){db.cases=db.cases.filter(x=>x.id!==id);save()}}
function openCompany(id){editCo=id||null;let x=id?db.companies.find(a=>a.id===id):{};$('coName').value=x.name||'';$('coContact').value=x.contact||'';$('coPhone').value=x.phone||'';$('coSocial').value=x.social||'';$('coEmail').value=x.email||'';$('coStatus').value=x.status||'合作中';companyDlg.showModal()}
$('companyForm').onsubmit=e=>{e.preventDefault();let x={id:editCo||crypto.randomUUID(),name:$('coName').value,contact:$('coContact').value,phone:$('coPhone').value,social:$('coSocial').value,email:$('coEmail').value,status:$('coStatus').value};let i=db.companies.findIndex(a=>a.id===x.id);i<0?db.companies.push(x):db.companies[i]=x;companyDlg.close();save()}
function delCompany(id){if(db.cases.some(x=>x.companyId===id)){alert('這家公司已有案件，不能刪除');return}if(confirm('確定刪除？')){db.companies=db.companies.filter(x=>x.id!==id);save()}}
render();
</script></body></html>
